[theme]
# Fixed light theme so chart colours stay on the validated reference palette (see docs).
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
# Local runs: start with `--server.address localhost` (see README) so the dashboard is not exposed on
# the local network. The address is NOT set here because hosted platforms (e.g. Streamlit Community
# Cloud) must bind their own interface.

[client]
# Hide developer-only toolbar items (e.g. "Deploy") from viewers.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
